name: Build and push backend image

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GHCR rejects uppercase names; ${VAR@L} lowercases the repo
      - name: Set lowercase image tag
        id: tag
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY@L}:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.tag.outputs.image }}
