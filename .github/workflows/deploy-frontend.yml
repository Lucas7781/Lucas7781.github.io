name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['portofolio-app/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portofolio-app/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: portofolio-app
      - name: Run tests
        run: npm test
        working-directory: portofolio-app
      - name: Build
        run: npm run build
        working-directory: portofolio-app
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portofolio-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
